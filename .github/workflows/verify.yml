name: Verify published game
on:
  workflow_run:
    workflows: ['Build and deploy Fragments']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install browser test tools
        run: |
          npm install --prefix .tools/browser --no-save --package-lock=false playwright@1.56.1
          .tools/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Open the published game
        run: |
          cp scripts/verify-webgl.cjs .tools/browser/verify-webgl.cjs
          node .tools/browser/verify-webgl.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: .tools/browser/results
